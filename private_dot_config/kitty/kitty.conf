# --- Appearance ----------

# Transparency
background_opacity 0.88

# Let Niri handle window decoration
hide_window_decorations yes

# Some breathing room around terminal contents
window_padding_width 10

# Center text when the window doesn't divide evenly into cells
placement_strategy center

# --- Niri integration ----------

# Request compositor blur behind transparent Kitty windows.
# Supported by modern Niri via ext-background-effect.
background_blur 1

# --- Cursor ----------

cursor_shape block
cursor_shape_unfocused hollow

# Subtle modern cursor animation
cursor_trail 150
cursor_trail_decay 0.02 0.08
cursor_trail_start_threshold 4

cursor #B59A63
cursor_trail_color #9E5A42

selection_background #504A3F
selection_foreground #E8E3D7

# --- Scrollback ----------

scrollback_lines 10000

# Keep the terminal visually clean
scrollbar never

# --- Shell Integration ----------

shell_integration enabled

# Notify through the desktop notification system when a command
# taking >10 seconds finishes while Kitty isn't visible.
notify_on_cmd_finish invisible 10
